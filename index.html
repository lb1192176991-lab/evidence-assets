<script>
const API = window.location.origin;
let allPosts = [];
let currentLang = 'zh';
// 全局鼠标追踪（给弹幕引擎用）
let danmaku_mouseX = -9999, danmaku_mouseY = -9999;
document.addEventListener('mousemove', function(e) {
  danmaku_mouseX = e.clientX;
  danmaku_mouseY = e.clientY;
});

// ===== Token认证管理 =====
function getToken() { try { return localStorage.getItem('tucao_token') || ''; } catch(e){return '';} }
function saveToken(t) { try { localStorage.setItem('tucao_token', t); } catch(e){} }
function clearToken() { try { localStorage.removeItem('tucao_token'); } catch(e){} }
function isLoggedIn() { return getToken().length > 10; }
function authHeaders() {
  const t = getToken();
  return t ? {'Content-Type':'application/json', 'Authorization':'Bearer ' + t} : {'Content-Type':'application/json'};
}

// 页面加载时恢复登录态
async function restoreLogin() {
  if (!isLoggedIn()) return;
  document.getElementById('login-btn').textContent = '👤 ...';
  try {
    const r = await fetch(API + '/api/auth/me', {headers:{'Authorization':'Bearer ' + getToken()}});
    if (!r.ok) { clearToken(); updateLoginBtn(); return; }
    const d = await r.json();
    if (d.ok) {
      document.getElementById('login-btn').textContent = '👤 ' + (d.user.nickname || '我');
      document.getElementById('coin-balance-badge').textContent = (d.user.coin_balance || 0) > 999 ? '999+' : (d.user.coin_balance || 0);
      document.getElementById('my-posts-btn').style.display = '';
      document.getElementById('notif-btn').style.display = '';
    } else {
      clearToken();
      updateLoginBtn();
    }
  } catch(e) { updateLoginBtn(); }
}
function updateLoginBtn() {
  const btn = document.getElementById('login-btn');
  btn.textContent = isLoggedIn() ? '👤 已登录' : '👤 登录';
}

// ===== 登录/注册弹窗 =====
function showAuthModal() {
  initShareUI();
  // 如果已登录，显示登出选项
  if (isLoggedIn()) {
    if (confirm('已登录。要登出吗？')) {
      fetch(API + '/api/auth/logout', {method:'POST', headers:{'Authorization':'Bearer ' + getToken()}}).catch(()=>{});
      clearToken();
      updateLoginBtn();
      document.getElementById('coin-balance-badge').textContent = '0';
    }
    return;
  }
  
  const overlay = document.createElement('div');
  overlay.className = 'share-overlay auth-overlay';
  overlay.onclick = () => { overlay.remove(); resetDanmakuHover(); };
  overlay.innerHTML = `<div class="share-box" onclick="event.stopPropagation()" style="max-width:400px;padding:24px">
    <button class="share-close" onclick="this.closest('.share-overlay').remove();resetDanmakuHover()">✕</button>

async function doLogin() {
  const nick = document.getElementById('auth-nick')?.value?.trim();
  const pass = document.getElementById('auth-pass')?.value;
  const errEl = document.getElementById('auth-error');
  if (!nick || !pass) { errEl.textContent = '请填写昵称和密码'; return; }
  try {
    const r = await fetch(API + '/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({nickname:nick, password:pass})});
    const d = await r.json();
    if (!r.ok) { errEl.textContent = d.error || '登录失败'; return; }
    saveToken(d.user.token);
    document.getElementById('login-btn').textContent = '👤 ' + (d.user.nickname || '我');
    document.getElementById('coin-balance-badge').textContent = (d.user.coin_balance || 0) > 999 ? '999+' : (d.user.coin_balance || 0);
    document.getElementById('my-posts-btn').style.display = '';
    document.getElementById('notif-btn').style.display = '';
    document.querySelector('.share-overlay')?.remove();
    // 刷新免费额度
    showFreePostRemaining();
  } catch(e) { errEl.textContent = '网络错误'; }
}

async function doRegister() {
  const nick = document.getElementById('auth-nick')?.value?.trim();
  const pass = document.getElementById('auth-pass')?.value;
  const errEl = document.getElementById('auth-error');
  if (!nick || !pass || pass.length < 4) { errEl.textContent = '昵称必填，密码至少4位'; return; }
  try {
    const r = await fetch(API + '/api/auth/register', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({nickname:nick, password:pass})});
    const d = await r.json();
    if (!r.ok) { errEl.textContent = d.error || '注册失败'; return; }
    saveToken(d.user.token);
    document.getElementById('login-btn').textContent = '👤 ' + (d.user.nickname || '我');
    document.getElementById('my-posts-btn').style.display = '';
    document.getElementById('notif-btn').style.display = '';
    document.querySelector('.share-overlay')?.remove();
    showFreePostRemaining();
    alert('✅ 注册成功！现在可以永久保存你的硬币了 🎉');
  } catch(e) { errEl.textContent = '网络错误'; }
}

// ===== GitHub OAuth 登录 =====
function githubLogin() {
  fetch(API + '/api/auth/github/login')
    .then(r => r.json())
    .then(d => {
      if (d.redirect_url) {
        // 打开授权窗口
        const w = window.open(d.redirect_url, 'social-oauth', 'width=600,height=700');
      } else {
        alert(d.error || '登录暂时不可用');
      }
    })
    .catch(() => alert('网络错误'));
}

// ===== 通用社交登录函数 =====
function googleLogin() { socialLogin('/api/auth/google/login'); }
function discordLogin() { socialLogin('/api/auth/discord/login'); }

function socialLogin(path) {
  fetch(API + path)
    .then(r => r.json())
    .then(d => {
      if (d.redirect_url) {
        window.open(d.redirect_url, 'social-oauth', 'width=600,height=700');
      } else {
        alert(d.error || '登录暂时不可用');
      }
    })
    .catch(() => alert('网络错误'));
}

// ===== 统一监听OAuth回调（GitHub/Google/Discord） =====
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'social_oauth') {
    const token = e.data.token;
    const nickname = e.data.nickname;
    if (token && token.length > 10) {
      saveToken(token);
      document.getElementById('login-btn').textContent = '👤 ' + (nickname || '用户');
      document.getElementById('my-posts-btn').style.display = '';
      document.getElementById('notif-btn').style.display = '';
      document.querySelector('.share-overlay')?.remove();
      showFreePostRemaining();
    }
  }
});

function switchLang(lang) {
  currentLang = lang; const t = i18n[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => { const k=el.getAttribute('data-i18n'); if(t[k]!==undefined) el.textContent=t[k]; });
  // 更新 placeholder 翻译
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const k=el.getAttribute('data-i18n-placeholder'); if(t[k]!==undefined) el.placeholder=t[k]; });
  document.documentElement.lang = lang==='zh'?'zh-CN':lang; document.title=t.site_title;
  document.querySelectorAll('.lang-btn').forEach((b,i)=>b.classList.toggle('active',['zh','en','ja','ko','fr','de','es','pt','ru','ar'][i]===lang));
  try{localStorage.setItem('tucao_lang',lang)}catch(e){}
  updateSelectors(); updateHotTags(); updateStats();
}
function detectLang() {
  try{const s=localStorage.getItem('tucao_lang');if(s&&i18n[s])return s}catch(e){}
  const l=(navigator.language||'').toLowerCase();
  if(l.startsWith('ja'))return'ja';if(l.startsWith('ko'))return'ko';
  if(l.startsWith('zh'))return'zh';if(l.startsWith('fr'))return'fr';
  if(l.startsWith('de'))return'de';if(l.startsWith('es'))return'es';
  if(l.startsWith('pt'))return'pt';if(l.startsWith('ru'))return'ru';
  if(l.startsWith('ar'))return'ar';return'en';
}

  try{
    fetch(API+'/api/stats').then(r=>r.json()).then(d=>{
      const p=document.getElementById('stat-posts'); if(p) p.textContent=d.total_posts||allPosts.length;
      const v=document.getElementById('stat-visitors'); if(v) v.textContent=d.unique_visitors||'?';

    // 计算今日帖子数（粗略）
    const today = new Date().toDateString();
    const todayPosts = allPosts.filter(p => p.created_at && new Date(p.created_at).toDateString() === today).length;
    const td=document.getElementById('stat-today'); if(td) td.textContent=todayPosts||0;
  }catch(e){}
}

function toggleSearch() {
  const bar = document.getElementById('search-bar');
  if (bar) bar.style.display = bar.style.display === 'none' ? 'block' : 'none';
  if (bar.style.display === 'block') setTimeout(() => document.getElementById('search-input')?.focus(), 100);
}
async function doSearch() {
  const q = document.getElementById('search-input')?.value?.trim();
  const results = document.getElementById('search-results');
  if (!q) { results.style.display = 'none'; return; }
  results.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);padding:10px">搜索中...</div>';
  results.style.display = 'block';
  try {
    const r = await fetch(API + '/api/posts/search?q=' + encodeURIComponent(q));
    const d = await r.json();
    if (!d.posts || d.posts.length === 0) {
      results.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);padding:10px">没有找到相关吐槽</div>';
      return;
    }
    results.innerHTML = d.posts.map(p =>
      `<div onclick="unlockAndShowPost(Object.assign({},p,${JSON.stringify(p)}))" style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;font-size:14px">
        <span style="color:${p.color||'#4d96ff'}">${esc(p.nickname||'')}</span>: ${esc((p.content||'').length > 50 ? p.content.slice(0,50)+'...' : p.content)}
        <span style="color:rgba(255,255,255,0.3);font-size:12px;margin-left:8px">❤️ ${p.likes||0}</span>
      </div>`
    ).join('');
  } catch(e) { results.innerHTML = '<div style="text-align:center;color:#ff6b6b;padding:10px">搜索失败</div>'; }
}
function renderPanel() {
  const list = document.getElementById('post-panel-list');
  if (!list) return;
  const t = i18n[currentLang];
  if (panelMode === 'trending') {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:rgba(255,255,255,0.3);font-size:13px">加载中...</div>';
    fetch(API + '/api/posts/trending').then(r=>r.json()).then(posts => {
      trendingCache = posts;
      renderTrendingList(list, posts, t);
    }).catch(() => {
      list.innerHTML = '<div style="padding:20px;text-align:center;color:rgba(255,255,255,0.2);font-size:13px">加载失败</div>';
    });
    return;
  }
  let posts = [...allPosts];
  if (panelMode === 'hot') posts.sort((a,b) => (b.likes||0) - (a.likes||0));
  if (posts.length === 0) { list.innerHTML = '<div style="padding:20px;text-align:center;color:rgba(255,255,255,0.2);font-size:13px">暂无吐槽</div>'; return; }
  const COLORS = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#a855f7','#ff9f43','#00bcd4'];
  list.innerHTML = posts.slice(0,30).map(p => {
    const c = p.color || COLORS[Math.floor(Math.random()*COLORS.length)];
    const nick = p.nickname || '匿名';
    return `<div class="pp-item" onclick="window.open('/post/${p.id}','_blank')" style="--pp-c:${c}">
      <span class="pp-nick">${esc(nick)}</span>
      <span class="pp-text">${esc(p.content)}</span>
      <span class="pp-likes">❤️ ${p.likes||0}</span>
    </div>`;
  }).join('');
}
function renderTrendingList(list, posts, t) {
  if (!posts || posts.length === 0) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:rgba(255,255,255,0.2);font-size:13px">暂无趋势数据</div>';
    return;
  }
  const medals = ['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟'];
  list.innerHTML = posts.slice(0,20).map((p, i) => {
    const c = p.color || '#4d96ff';
    const score = ((p.likes||0) * 2 + (p.share_count||0) * 3);
    return `<div class="pp-item" onclick="window.open('/post/${p.id}','_blank')" style="--pp-c:${c}">
      <span style="font-size:16px;min-width:28px">${medals[i]||''}</span>
      <span class="pp-nick">${esc(p.nickname||'匿名')}</span>
      <span class="pp-text">${esc(p.content)}</span>
      <span class="pp-likes">🔥 ${score}</span>
    </div>`;
  }).join('');
}

let danmakuEngine = null;

function initDanmakuEngine() {
  if (danmakuEngine) return;

  const TRACK_GAP = 52;
  const TRACKS = 10;
  const tracks = [];
  for (let i = 0; i < TRACKS; i++) tracks.push(i * TRACK_GAP + 3);
  
  function addItem(post) {
    const fontSize = randomFontSize();
    const color = post.color || randomColor();
    const trackY = tracks[post.id % TRACKS];
    const dur = 8 + Math.random() * 6;
    
    const el = document.createElement('div');
    el.className = 'danmaku-msg danmaku-move';
    el.style.cssText = `position:absolute;white-space:nowrap;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:6px;padding:3px 12px;font-size:${fontSize}px;background:${color}18;border:1px solid ${color}55;color:#fff;text-shadow:0 0 15px ${color}44,0 0 30px ${color}22;top:${trackY}px;animation-duration:${dur}s;animation-delay:${Math.random()*-dur}s;will-change:transform`;
    
    const profTag = post.profession ? `<span class="prof-tag" style="color:${color}">${esc(post.profession)}</span>` : '';
    const targetStr = post.target ? ` → ${esc(post.target)}` : '';
    const featEmoji = post.featured ? ' 🔥' : '';
    el.innerHTML = `${profTag}<span class="nick" style="color:${color}">${esc(post.nickname)}${targetStr}${featEmoji}</span><span class="danmaku-text" data-full="${esc(post.content)}">${esc(post.content.length > 30 ? post.content.slice(0, 27) + '...' : post.content)}</span><span class="like-btn">❤️</span><span class="likes" id="likes-${post.id}">${post.likes}</span>`;
    el.style.cursor = 'pointer';
    // 注意：mouseenter/mouseleave用全局委托处理（见下方），不在每个元素上单独绑定
    el.addEventListener('click', function(e) {
      if (e.target.closest('.like-btn')) return;
      unlockAndShowPost(post);
    });
    el.querySelector('.like-btn')?.addEventListener('click', function(e) {
      e.stopPropagation();
      likePost(post.id, this);
    });
    let pressTimer = null;
    el.addEventListener('touchstart', function(e) { pressTimer = setTimeout(function() { showLongPressMenu(post, color); }, 500); }, {passive: true});
    el.addEventListener('touchend', function() { clearTimeout(pressTimer); });
    el.addEventListener('touchmove', function() { clearTimeout(pressTimer); }, {passive: true});
    el.addEventListener('contextmenu', function(e) { e.preventDefault(); showLongPressMenu(post, color); });
    
    const trackEl = document.getElementById('danmaku-track');
    if (trackEl) trackEl.appendChild(el);
  }
  
  danmakuEngine = {
    load(posts) {
      const trackEl = document.getElementById('danmaku-track');
      if (trackEl) trackEl.innerHTML = '';
      if (!posts || posts.length === 0) return;
      posts.slice(0, 40).forEach(p => addItem(p));
    },
    addOne(post) { addItem(post); }
  };

  // 事件委托：直接用document级别的mouseover事件
  // 鼠标移到弹幕上 -> classList加danmaku-paused -> CSS暂停动画
  // 鼠标移出 -> 重新检查所有弹幕，移除非悬停的danmaku-paused
  document.addEventListener('mouseover', function(e) {
    const msg = e.target.closest('.danmaku-msg');
    if (msg) {
      msg.classList.add('danmaku-paused');
    }
  });
  // 定期清理：移除非悬停弹幕的暂停状态
  setInterval(function() {
    document.querySelectorAll('.danmaku-msg.danmaku-paused').forEach(function(el) {
      if (!el.matches(':hover')) {
        el.classList.remove('danmaku-paused');
      }
    });
  }, 200);
}

async function loadPosts() {
  const t = i18n[currentLang];
  try {
    const res = await fetch(`${API}/api/posts?limit=40`);
    const data = await res.json();
    allPosts = data.posts || [];

async function submitPost(){
  const t=i18n[currentLang];
  const content=document.getElementById('post-input').value.trim();
  const nickname=document.getElementById('nick-input').value.trim()||t.post_anonymous;
  const profession=document.getElementById('profession-select').value;
  const target=document.getElementById('target-select').value;
  if(!content){alert(t.post_empty_alert);return;}
  if(content.length>500){alert(t.post_max_alert);return;}
  try{
    const headers = authHeaders();
    const res=await fetch(`${API}/api/posts`,{method:'POST',headers,body:JSON.stringify({content,nickname,profession,target})});
    const data=await res.json();
    if(!res.ok){
      if (data.need_login) {
        if (confirm(data.error + '\n\n要去登录/注册吗？')) showAuthModal();
      } else if (data.need_coin) {
        // 提示余额不足，弹商店
        if (confirm(data.error + '\n\n要去💎商店充值吗？')) showShopModal();
      } else {
        alert(data.error||t.post_fail_alert);
      }
      return;
    }
    document.getElementById('post-input').value='';
    // 增量添加新弹幕到引擎，不重置全部
    if (danmakuEngine && data) {
      danmakuEngine.addOne(data);
      allPosts.unshift(data);
      updateStats();
    }
    // 更新余额badge
    if (data.balance !== null && data.balance !== undefined) {
      document.getElementById('coin-balance-badge').textContent = data.balance > 999 ? '999+' : data.balance;
    }
    // 更新今日剩余免费次数显示
    showFreePostRemaining();
  }catch(e){alert(t.post_fail_alert)}
}

async function unlockAndShowPost(post) {
  // 内容 <= 30字直接显示，不收费

    showPostDetail(post);
    return;
  }
  // 长内容需要1金币
  if (!confirm('💰 查看全文需要 1 金币。要继续吗？')) return;
  try {
    const r = await fetch(API + '/api/posts/' + post.id + '/unlock', {method:'POST'});
    const d = await r.json();
    if (!r.ok) {
      if (confirm(d.error + '\n\n要去💎商店充值吗？')) showShopModal();
      return;
    }
    // 更新余额
    document.getElementById('coin-balance-badge').textContent = d.balance > 999 ? '999+' : d.balance;
    showPostDetail(d);
  } catch(e) { alert('网络错误'); }
}

function showToast(msg) {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 24px;border-radius:12px;font-size:14px;z-index:9999;animation:fadeIn 0.2s;border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(10px);pointer-events:none';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.5s'; setTimeout(() => el.remove(), 500); }, 2500);
}

function copyShareText(text) {
  navigator.clipboard.writeText(text).then(() => {
    alert('✅ ' + (i18n[currentLang].copied || '已复制！'));
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    alert('✅ ' + (i18n[currentLang].copied || '已复制！'));
  });
}

async function featurePost(postId) {

  const t = i18n[currentLang];
  if (!confirm('付费 $0.99 置顶这条吐槽？（支付后你的帖子将排在顶部）')) return;
  try {
    const res = await fetch(API + '/api/posts/' + postId + '/feature', {method:'POST'});

    if (data.payment_url) {
      // 打开Gumroad支付页 - 付费后跳转回吐槽墙，自动检测并置顶
      const returnUrl = window.location.origin + '/?featured=' + postId;

      window.open(payUrl, '_blank', 'width=500,height=700');
      // 轮询检测置顶状态
      const checkInterval = setInterval(async () => {
        try {
          // 直接调verify-payment（用户付完款后会自动置顶）

            clearInterval(checkInterval);

      }, 3000);

      setTimeout(() => clearInterval(checkInterval), 120000);
    } else {
      alert('获取支付链接失败');

  } catch(e) {
    alert('请求失败');
  }
}

  try {
    const res = await fetch(API + '/api/referral/claim', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code})
    });
    const data = await res.json();
    if (data.ok) {

// ===== PWA注册 + 自动更新 =====
if ('serviceWorker' in navigator) {
  // 同时注册新路径（sw.js），兼容旧版
  navigator.serviceWorker.register('/sw.js').catch(function(){});
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/service-worker.js').then(function(reg) {
      console.log('SW registered:', reg.scope);
      // 检测更新
      reg.addEventListener('updatefound', function() {
        const newSW = reg.installing;
        newSW.addEventListener('statechange', function() {
          if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
            // 新版本可用，立即激活
            newSW.postMessage({action: 'skipWaiting'});
            window.location.reload();
          }
        });
      });
    }, function(err) {
      console.log('SW failed:', err);
    });
  });
  // 监听controller变化，自动刷新
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });
}
